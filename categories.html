<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เลือกหมวดหมู่</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Niramit:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --menu-color: #ffffff;
    --menu-hover: #57c2ff;
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
  }
  body {
    background-size: cover;
    background-position: center;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "Niramit", sans-serif;
  }
  .stage {
    position: relative;
    width: 100%;
    max-width: 1100px;
    aspect-ratio: 1376 / 768;
    background-image: url("image/main.png");
    background-size: cover;
    background-position: center;
    border-radius: 4px;
    overflow: hidden;
  }

  .page-title {
    position: absolute;
    top: 21%;
    left: 63%;
    margin-top: 10px;
    transform: translate(-50%, -100%);
    color: #ffffff;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-align: center;
    white-space: nowrap;
    font-size: clamp(16px, 2.6vw, 26px);
  }

  nav.menu {
    position: absolute;
    inset: 0;
  }
  .menu a {
    position: absolute;
    left: 50%;
    transform: translate(-50%, -100%);
    font-family: "Niramit", sans-serif;
    font-weight: 500;
    font-style: normal;
    color: var(--menu-color);
    text-decoration: none;
    letter-spacing: 0.02em;
    white-space: nowrap;
    font-size: clamp(11px, 2vw, 22px);
    padding-bottom: 4px;
    transition: color 0.15s ease, transform 0.15s ease;
    background: none;
    border: none;
    cursor: pointer;
  }
  .menu a:hover,
  .menu a:focus-visible {
    color: var(--menu-hover);
    transform: translate(-50%, -105%);
  }
  .menu a:focus-visible {
    outline: 1px solid var(--menu-hover);
    outline-offset: 4px;
  }

  .item-1 { margin-top: 5px; top: 30.0%; left: 65.0%; margin-left: 130px; }
  .item-2 { margin-top: 5px; top: 37.6%; left: 62.6%; margin-left: 130px; }
  .item-3 { margin-top: 10px; top: 43.6%; left: 59.9%; margin-left: 130px; }
  .item-4 { margin-top: 15px; top: 50.0%; left: 61.2%; margin-left: 130px; }
  .item-5 { margin-top: 15px; top: 57.3%; left: 64.0%; margin-left: 130px; }

  @media (max-width: 480px) {
    .page-title { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="page-title">เลือกหมวดหมู่</div>

  <nav class="menu" aria-label="เมนูหมวดหมู่">
    <a href="game.html?category=computer-technology" class="item-1">หมวดคอมพิวเตอร์และเทคโนโลยี</a>
    <a href="game.html?category=network-internet" class="item-2">หมวดเครือข่ายและอินเทอร์เน็ต</a>
    <a href="game.html?category=digital-business-marketing" class="item-3">หมวดธุรกิจดิจิทัลและการตลาด</a>
    <a href="game.html?category=programming-database" class="item-4">หมวดการเขียนโปรแกรมและฐานข้อมูล</a>
    <a href="index.html" class="item-5">กลับหน้าเมนูหลัก</a>
  </nav>
</div>

</body>
</html>
