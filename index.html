<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hangman</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Niramit:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="background.css">
    <link rel="stylesheet" href="bg-base.css">

</head>


<body>

    <div class="stage">


        <!-- BACKGROUND (สร้างด้วยโค้ด แทน main.png) -->

        <div class="bg" aria-hidden="true">

            <div class="bg-glow"></div>
            <div class="bg-grid"></div>

            <!-- พื้นหลังเคลื่อนไหว (วาดด้วย bg.js) -->
            <canvas class="bg-canvas" id="bgCanvas"></canvas>

            <!-- หัวเกม -->
            <div class="bg-word">
                <span><b style="--d:0s">H</b></span>
                <span><b style="--d:1.2s">A</b></span>
                <span><b style="--d:2.4s">N</b></span>
                <span><b style="--d:3.6s">G</b></span>
                <span><b style="--d:4.8s">M</b></span>
                <span><b style="--d:4.8s">A</b></span>
                <span><b style="--d:4.8s">N</b></span>
            </div>

            <!-- ตะแลงแกง + ตัวคนไม้ขีด -->
            <svg class="gallows" viewBox="0 0 260 300" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <g class="g-frame">
                    <path d="M20 280H200M60 280V30H170M60 85L115 30" />
                </g>
                <g class="figure">
                    <path d="M170 30V70" />
                    <circle class="p p1" cx="170" cy="88" r="18" pathLength="1" />
                    <path class="p p2" d="M170 106V180" pathLength="1" />
                    <path class="p p3" d="M170 125L140 160" pathLength="1" />
                    <path class="p p4" d="M170 125L200 160" pathLength="1" />
                    <path class="p p5" d="M170 180L145 235" pathLength="1" />
                    <path class="p p6" d="M170 180L195 235" pathLength="1" />
                </g>
            </svg>

    

            <!-- กรอบเมนู -->
            <div class="bg-panel"></div>
        </div>
        


        <!-- USER ACCOUNT -->

        <div class="user-account" id="userAccount">

            <div class="user-name" id="userName">
                👤 ผู้ใช้
            </div>

            <button type="button" id="logoutBtn">
                ออกจากบัญชี
            </button>

        </div>

        <!-- MAIN MENU -->

        <nav class="menu" aria-label="เมนูหลัก">

            <a href="categories.html" class="item-2" id="playGameBtn">
                เล่นเกม
            </a>

            <a href="#" class="item-3">
                คู่มือการเล่น
            </a>

            <a href="statistics.html" class="item-4" id="statisticsBtn">
                ดูสถิติการเล่น
            </a>

            <a href="creator.html" class="item-5">
                ประวัติผู้สร้างเกม
            </a>

            <a href="#" class="item-6" id="exitBtn">
                ออกจากเกม
            </a>

        </nav>


        <!-- LOGIN MODAL -->

        <div class="login-backdrop" id="loginBackdrop">

            <div class="login-panel" role="dialog" aria-modal="true" aria-labelledby="loginTitle">

                <!-- CLOSE -->

                <button type="button" class="login-close" id="loginClose" aria-label="ปิด">
                    ×
                </button>


                <!-- TITLE -->

                <h2 id="loginTitle">
                    เข้าสู่ระบบ
                </h2>


                <p id="loginDescription">
                    เข้าสู่ระบบเพื่อเริ่มเล่นเกม Hangman
                </p>


                <!-- USERNAME -->

                <div class="input-group">

                    <input type="text" id="authName" placeholder="ชื่อผู้ใช้" maxlength="30" autocomplete="username">

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <div class="password-box">

                        <input type="password" id="authPassword" placeholder="รหัสผ่าน" minlength="8"
                            autocomplete="current-password">

                        <button type="button" id="togglePassword" class="password-toggle" aria-label="แสดงรหัสผ่าน">

                            <span class="eye-icon">
                                👁
                            </span>

                            <span class="eye-slash"></span>

                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group hidden" id="confirmPasswordWrap">

                    <div class="password-box">

                        <input type="password" id="confirmPassword" placeholder="ยืนยันรหัสผ่าน" minlength="8"
                            autocomplete="new-password">

                        <button type="button" id="toggleConfirmPassword" class="password-toggle"
                            aria-label="แสดงรหัสผ่าน">

                            <span class="eye-icon">
                                👁
                            </span>

                            <span class="eye-slash"></span>

                        </button>

                    </div>

                </div>


                <!-- LOGIN / SIGN UP BUTTON -->

                <button type="button" class="login-btn" id="emailLogin">
                    SIGN IN
                </button>


                <!-- SIGN UP SWITCH -->

                <p class="signup-switch">

                    ยังไม่มีบัญชี?

                    <button type="button" id="toggleSignup">
                        สร้างบัญชี
                    </button>

                </p>


                <!-- STATUS -->

                <div class="login-status" id="loginStatus"></div>

            </div>

        </div>


        <!-- EXIT MODAL -->

        <div class="exit-backdrop" id="exitBackdrop">

            <div class="exit-panel" role="dialog" aria-modal="true" aria-labelledby="exitTitle">

                <p class="exit-title" id="exitTitle">
                    ยืนยันว่าคุณต้องการออกจากเกมใช่หรือไม่?
                </p>


                <div class="exit-actions">

                    <button type="button" class="exit-confirm" id="exitConfirm">
                        ใช่, ออกจากเกม
                    </button>

                    <button type="button" class="exit-cancel" id="exitCancel">
                        ยกเลิก
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="bg.js"></script>
    <script type="module" src="script.js"></script>

</body>

</html>
