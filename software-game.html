<!DOCTYPE html>

<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ซอฟต์แวร์</title>

    <link href="https://fonts.googleapis.com/css2?family=Niramit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }

        html,

        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: #000;

            font-family: "Niramit", sans-serif;

        }

        .game-stage {

            position: relative;

            width: 100vw;

            height: 100vh;

            max-width: 1376px;

            max-height: 768px;

            margin: auto;

            overflow: hidden;

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

        }

        /* =========================

   ข้อ

========================= */

        .question-number {

            position: absolute;

            top: 2.5%;

            left: 3%;

            color: white;

            font-size: clamp(17px, 1.7vw, 25px);

            font-weight: 700;

            text-shadow: 2px 2px 3px #000;

        }

        /* =========================

   ระดับ

========================= */

        .level {

            position: absolute;

            top: 7%;

            left: 3%;

            color: white;

            font-size: clamp(15px, 1.5vw, 22px);

            font-weight: 700;

            text-shadow: 2px 2px 3px #000;

        }

        /* =========================

   หมวด

========================= */

        .category {

            position: absolute;

            top: 4%;

            left: 50%;

            transform: translateX(-50%);

            min-width: 300px;

            padding: 7px 25px;

            background: white;

            color: #111;

            border: 4px solid #aaa;

            border-radius: 35px;

            text-align: center;

            font-size: clamp(18px, 2vw, 29px);

            font-weight: 700;

            box-shadow:

                0 2px 0 #fff,

                0 4px 8px rgba(0, 0, 0, .5);

        }

        /* =========================

   ปุ่มเสียง

========================= */

        .sound-btn {

            position: absolute;

            top: 4%;

            right: 3%;

            width: 55px;

            height: 55px;

            border: 3px solid #999;

            border-radius: 15px;

            background: #e94b16;

            color: white;

            font-size: 27px;

            cursor: pointer;

        }

        /* =========================

   สระ

========================= */

        .vowels {

            position: absolute;

            left: 6%;

            top: 28%;

            display: flex;

            flex-direction: column;

            gap: 8px;

        }

        .vowel {

            width: 55px;

            height: 55px;

            border: 3px solid #aaa;

            border-radius: 15px;

            background: white;

            color: #a40000;

            font-family: inherit;

            font-size: 27px;

            font-weight: 700;

            box-shadow:

                0 2px 0 #fff,

                0 3px 5px rgba(0, 0, 0, .4);

            cursor: pointer;

        }

        .vowel:disabled {

            opacity: .4;

            cursor: default;

        }

        /* =========================

   Hangman

========================= */

        .hangman-area {

            position: absolute;

            top: 19%;

            left: 50%;

            transform: translateX(-50%);

            width: 330px;

            height: 330px;

            display: flex;

            align-items: center;

            justify-content: center;

        }

        .hangman-svg {

            width: 100%;

            height: 100%;

        }

        /* =========================

   เส้น Hangman สีขาว

========================= */

        .hang-part {

            stroke: #ffffff !important;

            stroke-width: 7;

            fill: none !important;

            stroke-linecap: round;

            stroke-linejoin: round;

            opacity: 0;

            transition: opacity .3s ease;

        }

        .hang-part.show {

            opacity: 1;

        }

        /* =========================

   Stickman แกว่ง

========================= */

        #stickman.swing {

            transform-box: view-box;

            transform-origin: 210px 75px;

            animation: stickmanSwing 1s ease-in-out;

        }

        @keyframes stickmanSwing {

            0% {

                transform: rotate(0deg);

            }

            50% {

                transform: rotate(18deg);

            }

            100% {

                transform: rotate(0deg);

            }

        }

        /* =========================

   ช่องคำ

========================= */

        .word-area {

            position: absolute;

            top: 77%;

            left: 50%;

            transform: translateX(-50%);

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            max-width: 65%;

        }

        .letter-slot {

            width: 48px;

            height: 48px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #ffd83d;

            border: 2px solid #777;

            border-radius: 12px;

            color: #111;

            font-size: 26px;

            font-weight: 700;

        }

        /* =========================

   Keyboard

========================= */

        .keyboard {

            position: absolute;

            right: 5%;

            top: 24%;

            width: 180px;

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 7px;

        }

        .key {

            height: 50px;

            border: 3px solid #aaa;

            border-radius: 15px;

            background: white;

            color: #a40000;

            font-family: inherit;

            font-size: 24px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:

                0 2px 0 #fff,

                0 3px 5px rgba(0, 0, 0, .4);

        }

        .key:hover {

            transform: translateY(-2px);

        }

        .key:disabled {

            opacity: .4;

            cursor: default;

            transform: none;

        }

        /* =========================

   คะแนน

========================= */

        .score-box {

            position: absolute;

            right: 7%;

            bottom: 1%;

            width: 105px;

            height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: white;

            border: 3px solid #aaa;

            border-radius: 25px;

            color: #111;

            font-size: 24px;

            font-weight: 700;

            box-shadow: 0 2px 4px rgba(0, 0, 0, .4);

        }

        /* =========================

   ปุ่มกลับ

========================= */

        .back-btn {

            position: absolute;

            left: 3%;

            bottom: 4%;

            width: 55px;

            height: 55px;

            border: 3px solid #222;

            border-radius: 15px;

            background: #4caf50;

            color: white;

            font-size: 30px;

            font-weight: 700;

            cursor: pointer;

        }

        /* =========================

   ปุ่มคำใบ้

========================= */

        .hint-button {

            position: absolute;

            left: 9%;

            bottom: 4%;

            width: clamp(38px, 4.5vw, 55px);

            height: clamp(38px, 4.5vw, 55px);

            border: 0;

            border-radius: 14px;

            background: #ffd83d;

            color: #fff;

            font-size: clamp(20px, 2.5vw, 30px);

            cursor: pointer;

            z-index: 10;

            box-shadow:

                inset 0 0 0 2px #c5a52e,

                0 2px 0 rgba(0, 0, 0, .35);

        }

        .hint-button:hover:not(:disabled) {

            transform: translateY(-2px);

            background: #ffe36b;

        }

        .hint-button:disabled {

            opacity: .35;

            cursor: not-allowed;

        }

        .hint-count {

            position: absolute;

            left: 9%;

            bottom: 0.8%;

            width: clamp(38px, 4.5vw, 55px);

            text-align: center;

            color: white;

            font-size: clamp(9px, 1vw, 12px);

            font-weight: 600;

            z-index: 11;

            pointer-events: none;

            text-shadow: 0 1px 2px #000;

        }

        /* =========================

   Result

========================= */

        .result-screen {

            position: absolute;

            inset: 0;

            display: none;

            align-items: center;

            justify-content: center;

            background: rgba(0, 0, 0, .88);

            z-index: 100;

        }

        .result-box {

            width: min(700px, 85%);

            max-height: 90%;

            padding: 25px;

            overflow-y: auto;

            text-align: center;

            background: white;

            border: 5px solid #777;

            border-radius: 25px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, .7);

        }

        .result-title {

            margin: 0 0 10px;

            color: #d00000;

            font-size: 42px;

            font-weight: 700;

        }

        .result-title.correct {

            color: #159447;

        }

        .result-image {

            width: 250px;

            height: 150px;

            margin: 10px auto;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #eee;

            border: 3px dashed #999;

            border-radius: 15px;

            overflow: hidden;

            color: #777;

            font-size: 20px;

        }

        .result-image img {

            width: 100%;

            height: 100%;

            object-fit: contain;

        }

        #imagePlaceholder {
            color: #777;
            font-size: 16px;
            text-align: center;
            padding: 8px;
        }

        .result-word {

            font-size: 30px;

            font-weight: 700;

        }

        .result-meaning {

            margin: 8px 0;

            font-size: 23px;

        }

        .result-score {

            color: #d18a00;

            font-size: 28px;

            font-weight: 700;

        }

        .result-btn {

            margin-top: 15px;

            padding: 10px 30px;

            border: none;

            border-radius: 15px;

            background: #4caf50;

            color: white;

            font-family: inherit;

            font-size: 23px;

            font-weight: 700;

            cursor: pointer;

        }

        .result-btn.home {

            background: #333;

        }

        /* =========================================================

           ระดับ

        ========================================================= */

        const levels = [

            {

                name: "ง่าย",

                penalty: 10

            },

            {

                name: "ปานกลาง",

                penalty: 100

            },

            {

                name: "ยาก",

                penalty: 500

            }

        ];

        /* =========================================================

           ตัวแปร

        ========================================================= */

        const QUESTIONS_PER_GAME = 10;

        let currentQuestion = 0;

        let currentWord = null;

        let currentLevel = null;

        let currentScore = 2000;

        /* คะแนนรวมจาก 10 ข้อที่สุ่มจากคลังคำศัพท์ 30 คำ */

        let totalScore = 0;

        let wrongCount = 0;

        let usedWords = [];

        /* จำนวนคำใบ้ */

        let hintsRemaining = 2;

        let scoreSaved = false;
        let hintTimer = null;

        /* =========================================================

           DOM

        ========================================================= */

        const wordArea =

            document.getElementById("wordArea");

        const keyboard =

            document.getElementById("keyboard");

        const questionNumber =

            document.getElementById("questionNumber");

        const levelText =

            document.getElementById("level");

        const scoreBox =

            document.getElementById("scoreBox");

        const resultScreen =

            document.getElementById("resultScreen");

        const resultTitle =

            document.getElementById("resultTitle");

        const resultWord =

            document.getElementById("resultWord");

        const resultMeaning =

            document.getElementById("resultMeaning");

        const resultScore =

            document.getElementById("resultScore");

        const resultButton =

            document.getElementById("resultButton");

        const resultImage =

            document.getElementById("resultImage");

        const imagePlaceholder =

            document.getElementById("imagePlaceholder");

        /* DOM ของคำใบ้ */

        const hintButton =

            document.getElementById("hintButton");

        const hintCount =

            document.getElementById("hintCount");

        /* =========================================================

           ลำดับ Hangman 10 ขั้น

        ========================================================= */

        const hangmanParts = [

            "part1",

            "part2",

            "part3",

            "part4",

            "part5",

            "part6",

            "part7",

            "part8",

            "part9",

            "part10"

        ];

        /* =========================================================

           สุ่มคำ

        ========================================================= */

        function randomWord() {

            const available =

                words.filter(

                    item =>

                        !usedWords.includes(

                            item.word

                        )

                );

            const index =

                Math.floor(

                    Math.random() *

                    available.length

                );

            return available[index];

        }

        /* =========================================================

           สุ่มระดับ

        ========================================================= */

        function randomLevel() {

            const index =

                Math.floor(

                    Math.random() *

                    levels.length

                );

            return levels[index];

        }

        /* =========================================================

           Reset Hangman

        ========================================================= */

        function resetHangman() {

            wrongCount = 0;

            hangmanParts.forEach(

                id => {

                    document

                        .getElementById(id)

                        .classList

                        .remove("show");

                }

            );

            const stickman =

                document.getElementById(

                    "stickman"

                );

            stickman.classList.remove(

                "swing"

            );

        }

        /* =========================================================

           วาด Hangman

        ========================================================= */

        function drawHangman() {

            if (

                wrongCount >= 10

            ) {

                return;

            }

            const partId =

                hangmanParts[

                wrongCount

                ];

            const part =

                document.getElementById(

                    partId

                );

            part.classList.add(

                "show"

            );

            wrongCount++;

            /* ผิดครั้งที่ 10 */

            if (

                wrongCount === 10

            ) {

                setTimeout(

                    () => {

                        const stickman =

                            document.getElementById(

                                "stickman"

                            );

                        stickman.classList.remove(

                            "swing"

                        );

                        void stickman.offsetWidth;

                        stickman.classList.add(

                            "swing"

                        );

                        setTimeout(

                            () => {

                                showGameOver();

                            },

                            1000

                        );

                    },

                    300

                );

            }

        }

        /* =========================================================

           เริ่มข้อ

        ========================================================= */

        function startQuestion() {

            if (

                currentQuestion >= QUESTIONS_PER_GAME

            ) {

                showFinished();

                return;

            }

            currentWord =

                randomWord();

            showHint(currentWord.clue);

            currentLevel =

                randomLevel();

            usedWords.push(

                currentWord.word

            );

            currentScore =

                2000;

            /* รีเซ็ตคำใบ้ทุกข้อ */

            hintsRemaining =

                2;

            questionNumber.textContent =

                `ข้อ ${currentQuestion + 1} / ${QUESTIONS_PER_GAME}`;

            levelText.textContent =

                `ระดับ: ${currentLevel.name}`;

            updateScore();

            resetHangman();

            createWordSlots();

            createKeyboard();

            createVowels();

            updateHintButton();

        }

        /* =========================================================

           คะแนน

        ========================================================= */
        function showHint(text) {
            const hintBox = document.getElementById("hintBox");
            if (!hintBox) return;

            if (hintTimer !== null) {
                clearInterval(hintTimer);
            }

            hintBox.textContent = "";
            const characters = Array.from(text || "");
            let index = 0;

            hintTimer = setInterval(() => {
                if (index < characters.length) {
                    hintBox.textContent += characters[index];
                    index++;
                } else {
                    clearInterval(hintTimer);
                    hintTimer = null;
                }
            }, 35);
        }

        function updateScore() {

            scoreBox.textContent =

                currentScore;

        }

        /* =========================================================

           ช่องคำ

        ========================================================= */

        function createWordSlots() {

            wordArea.innerHTML =

                "";

            for (

                let i = 0;

                i < currentWord.word.length;

                i++

            ) {

                const slot =

                    document.createElement(

                        "div"

                    );

                slot.className =

                    "letter-slot";

                slot.dataset.index =

                    i;

                wordArea.appendChild(

                    slot

                );

            }

        }

        /* =========================================================

           Keyboard

        ========================================================= */

        function createKeyboard() {

            keyboard.innerHTML =

                "";

            const alphabet = [

                "B", "C", "D",

                "F", "G", "H",

                "J", "K", "L",

                "M", "N", "P",

                "Q", "R", "S",

                "T", "V", "W",

                "X", "Y", "Z"

            ];

            alphabet.forEach(

                letter => {

                    const button =

                        document.createElement(

                            "button"

                        );

                    button.className =

                        "key";

                    button.textContent =

                        letter;

                    button.onclick =

                        () => {

                            guessConsonant(

                                letter,

                                button

                            );

                        };

                    keyboard.appendChild(

                        button

                    );

                }

            );

        }

        /* =========================================================

           สระ

        ========================================================= */

        function createVowels() {

            document

                .querySelectorAll(".vowel")

                .forEach(

                    button => {

                        button.disabled =

                            false;

                        button.onclick =

                            () => {

                                guessVowel(

                                    button.textContent,

                                    button

                                );

                            };

                    }

                );

        }

        /* =========================================================

           ทายสระ

        ========================================================= */

        function guessVowel(

            letter,

            button

        ) {

            if (

                button.disabled

            ) {

                return;

            }

            button.disabled =

                true;

            if (

                currentWord.word.includes(

                    letter

                )

            ) {

                revealLetter(

                    letter

                );

                checkComplete();

            }

        }

        /* =========================================================

           ทายพยัญชนะ

        ========================================================= */

        function guessConsonant(

            letter,

            button

        ) {

            if (

                button.disabled

            ) {

                return;

            }

            button.disabled =

                true;

            /* ถูก */

            if (

                currentWord.word.includes(

                    letter

                )

            ) {

                revealLetter(

                    letter

                );

                checkComplete();

                return;

            }

            /* ผิด */

            currentScore -= currentLevel.penalty;

            updateScore();

            drawHangman();

        }

        /* =========================================================

           เปิดตัวอักษร

        ========================================================= */

        function revealLetter(

            letter

        ) {

            const word =

                currentWord.word;

            for (

                let i = 0;

                i < word.length;

                i++

            ) {

                if (

                    word[i] === letter

                ) {

                    const slot =

                        document.querySelector(

                            `.letter-slot[data-index="${i}"]`

                        );

                    if (slot) {

                        slot.textContent =

                            letter;

                    }

                }

            }

        }

        /* =========================================================

           ตรวจคำครบ

        ========================================================= */

        function checkComplete() {

            const slots =

                document.querySelectorAll(

                    ".letter-slot"

                );

            let complete =

                true;

            slots.forEach(

                slot => {

                    if (

                        slot.textContent === ""

                    ) {

                        complete =

                            false;

                    }

                }

            );

            if (

                complete

            ) {

                disableAllButtons();

                setTimeout(

                    () => {

                        showCorrect();

                    },

                    400

                );

            }

        }

        /* =========================================================

           ปิดปุ่ม

        ========================================================= */

        function disableAllButtons() {

            document

                .querySelectorAll(

                    ".key, .vowel"

                )

                .forEach(

                    button => {

                        button.disabled =

                            true;

                    }

                );

            hintButton.disabled =

                true;

        }

        /* =========================================================

           ระบบคำใบ้ ⭐

        ========================================================= */

        function updateHintButton() {

            hintCount.textContent =

                `${hintsRemaining}/2`;

            hintButton.disabled =

                hintsRemaining <= 0 ||

                resultScreen.style.display === "flex";

        }

        /* =========================================================

           ใช้คำใบ้

        ========================================================= */

        function useHint() {

            if (

                hintsRemaining <= 0 ||

                !currentWord

            ) {

                return;

            }

            const hiddenIndexes =

                [...document.querySelectorAll(

                    ".letter-slot"

                )]

                    .map(

                        (slot, index) =>

                            slot.textContent === ""

                                ? index

                                : -1

                    )

                    .filter(

                        index => index !== -1

                    );

            if (

                hiddenIndexes.length === 0

            ) {

                return;

            }

            const randomIndex =

                hiddenIndexes[

                Math.floor(

                    Math.random() *

                    hiddenIndexes.length

                )

                ];

            const letter =

                currentWord.word[randomIndex];

            revealLetter(

                letter

            );

            /* ล็อกปุ่มตัวอักษรที่คำใบ้เปิดให้ */

            const buttons =

                document.querySelectorAll(

                    ".key, .vowel"

                );

            buttons.forEach(

                button => {

                    if (

                        button.textContent.trim() ===

                        letter

                    ) {

                        button.disabled =

                            true;

                    }

                }

            );

            hintsRemaining--;

            updateHintButton();

            checkComplete();

        }

        /* ปุ่มคำใบ้ */

        hintButton.onclick =

            useHint;

        /* =========================================================

           ตอบถูก

        ========================================================= */

        function showCorrect() {

            /* เพิ่มคะแนนข้อนี้เข้าไปในคะแนนรวม */

            totalScore +=

                currentScore;

            resultScreen.style.display =

                "flex";

            hintButton.disabled =

                true;

            resultTitle.textContent =

                "ถูกต้อง!";

            resultTitle.classList.add(

                "correct"

            );

            resultWord.textContent =

                `คำศัพท์: ${currentWord.word}`;

            resultMeaning.textContent =

                `ความหมาย: ${currentWord.meaning}`;

            resultScore.textContent =

                `คะแนนข้อนี้: ${currentScore}`;

            showResultImage();

            resultButton.classList.remove(

                "home"

            );

            if (

                currentQuestion === QUESTIONS_PER_GAME - 1

            ) {

                resultButton.textContent =

                    "ดูผลคะแนน";

                resultButton.onclick =

                    showFinished;

            } else {

                resultButton.textContent =

                    "ข้อต่อไป";

                resultButton.onclick =

                    nextQuestion;

            }

        }

        /* =========================================================

           GAME OVER

        ========================================================= */

        function showGameOver() {

            disableAllButtons();

            resultScreen.style.display =

                "flex";

            hintButton.disabled =

                true;

            resultTitle.textContent =

                "GAME OVER";

            resultTitle.classList.remove(

                "correct"

            );

            resultWord.textContent =

                `คำศัพท์: ${currentWord.word}`;

            resultMeaning.textContent =

                `ความหมาย: ${currentWord.meaning}`;

            resultScore.textContent =

                `คะแนนที่เหลือ: ${currentScore}`;

            showResultImage();

            resultButton.textContent =

                "เริ่มใหม่";

            resultButton.classList.add(

                "home"

            );

            resultButton.onclick =

                restartGame;

        }

        /* =========================================================

           รูป

        ========================================================= */

        function showResultImage() {

            resultImage.style.display = "none";
            imagePlaceholder.style.display = "block";
            imagePlaceholder.textContent = "กำลังโหลดภาพ...";

            if (!currentWord.image) {
                imagePlaceholder.textContent = "ไม่มีภาพประกอบ";
                return;
            }

            resultImage.onload = function () {
                resultImage.style.display = "block";
                imagePlaceholder.style.display = "none";
                imagePlaceholder.textContent = "";
            };

            resultImage.onerror = function () {
                resultImage.style.display = "none";
                imagePlaceholder.style.display = "block";
                imagePlaceholder.textContent = "ไม่มีภาพประกอบ";
            };

            resultImage.src = currentWord.image;
        }

        /* =========================================================

           ข้อต่อไป

        ========================================================= */

        function nextQuestion() {

            currentQuestion++;

            resultScreen.style.display =

                "none";

            startQuestion();

        }

        /* =========================================================

           เริ่มใหม่

        ========================================================= */

        function restartGame() {

            currentQuestion =

                0;

            currentWord =

                null;

            currentLevel =

                null;

            currentScore =

                2000;

            /* รีเซ็ตคะแนนรวม */

            totalScore =

                0;

            wrongCount =

                0;

            usedWords =

                [];

            hintsRemaining =

                2;

            scoreSaved = false;

            resultScreen.style.display =

                "none";

            startQuestion();

        }

        /* =========================================================

           บันทึกคะแนนลง Firebase Firestore

        ========================================================= */

        async function saveFinalScore() {

    /* ป้องกันการบันทึกซ้ำ */

    if (scoreSaved) {

        return;

    }

    /* รอให้ Firebase ตรวจสอบสถานะ Login ก่อน */

    const user = await authReady;

    /* ถ้าไม่ได้ Login จะไม่บันทึก */

    if (!user) {

        console.error("ไม่พบผู้ใช้ที่กำลังเข้าสู่ระบบ");

        return;

    }

    scoreSaved = true;

    try {

        await addDoc(

            collection(db, "gameScores"),

            {

                uid: user.uid,

                name:

                    user.displayName ||

                    "ผู้ใช้",

                score:

                    Number(totalScore),

                category:

                    "คอมพิวเตอร์และเทคโนโลยี",

                subtopic:

                    "ซอฟต์แวร์",

                createdAt:

                    serverTimestamp()

            }

        );

        console.log(

            "บันทึกคะแนนสำเร็จ:",

            totalScore

        );

    } catch (error) {

        console.error(

            "ไม่สามารถบันทึกคะแนน:",

            error

        );

        scoreSaved = false;

    }

}

        /* =========================================================

           เล่นครบ 10 ข้อที่สุ่มมา

        ========================================================= */

        async function showFinished() {

    resultScreen.style.display = "flex";

    hintButton.disabled = true;

    document.querySelector(".result-image").style.display = "none";

    resultTitle.textContent =

        "ยินดีด้วย คุณเก่งมาก";

    resultTitle.classList.add("correct");

    resultWord.textContent =

        "คะแนนทั้งหมด";

    resultMeaning.textContent =

        `${totalScore} คะแนน`;

    resultScore.textContent =

        "กำลังบันทึกคะแนน...";

    /*

       รอการบันทึกคะแนนให้เสร็จก่อน

    */

    await saveFinalScore();

    resultScore.textContent = "";

    resultButton.textContent =

        "กลับหน้าเมนูหลัก";

    resultButton.classList.add("home");

    resultButton.onclick = function () {

        window.location.href =

            "index.html";

    };

}

        /* =========================================================

           กลับหน้าก่อนหน้า

        ========================================================= */

        function goHome() {

            window.history.back();

        }

        window.goHome = goHome;

        /* =========================================================

           เสียง

        ========================================================= */

        let soundOn =

            true;

        document

            .getElementById("soundBtn")

            .onclick =

            function () {

                soundOn =

                    !soundOn;

                this.textContent =

                    soundOn

                        ? "🔊"

                        : "🔇";

            };

        /* =========================================================

           เริ่มเกม

        ========================================================= */

        startQuestion();

    </script>
