<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hangman Game</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Niramit:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Niramit", sans-serif;
      background: #02070d;
      color: white;
      min-height: 100vh;
    }

    /* =========================
       MAIN
    ========================= */

    .stage {
      min-height: 100vh;

      background:
        linear-gradient(
          rgba(0, 5, 12, 0.45),
          rgba(0, 5, 12, 0.85)
        ),
        url("image/main.png");

      background-size: cover;
      background-position: center;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
    }

    .menu {
      width: 360px;

      display: flex;
      flex-direction: column;

      gap: 15px;

      text-align: center;
    }

    .menu h1 {
      font-size: 48px;
      color: #00eaff;

      text-shadow:
        0 0 10px rgba(0, 234, 255, 0.7),
        0 0 25px rgba(0, 234, 255, 0.35);

      margin-bottom: 25px;
    }

    .menu a {
      display: block;

      padding: 14px 20px;

      border: 1px solid #00eaff;
      border-radius: 8px;

      color: white;
      text-decoration: none;

      font-size: 20px;

      background: rgba(0, 20, 35, 0.75);

      transition:
        background 0.15s ease,
        color 0.15s ease,
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .menu a:hover {
      background: #00eaff;
      color: #001018;

      transform: translateY(-2px);

      box-shadow:
        0 0 15px rgba(0, 234, 255, 0.5);
    }


    /* =========================
       LOGIN MODAL
    ========================= */

    .login-backdrop {
      position: fixed;

      inset: 0;

      background: rgba(0, 0, 0, 0.82);

      display: none;

      align-items: center;
      justify-content: center;

      z-index: 9999;

      padding: 20px;
    }

    .login-backdrop.show {
      display: flex;
    }


    /* =========================
       LOGIN BOX
    ========================= */

    .login-panel {
      width: 400px;
      max-width: 100%;

      background:
        linear-gradient(
          145deg,
          #071522,
          #030a12
        );

      border: 1px solid #00eaff;

      border-radius: 18px;

      padding: 35px 30px;

      text-align: center;

      position: relative;

      box-shadow:
        0 0 25px rgba(0, 234, 255, 0.25),
        0 0 70px rgba(0, 234, 255, 0.08);

      animation: loginShow 0.25s ease;
    }


    @keyframes loginShow {

      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* =========================
       CLOSE BUTTON
    ========================= */

    .login-close {
      position: absolute;

      right: 15px;
      top: 10px;

      width: 35px;
      height: 35px;

      border: none;
      background: transparent;

      color: #9aa7b4;

      font-size: 30px;

      cursor: pointer;

      line-height: 35px;
    }

    .login-close:hover {
      color: white;
    }


    /* =========================
       LOGIN TITLE
    ========================= */

    .login-panel h2 {
      color: #00eaff;

      font-size: 30px;

      margin-bottom: 8px;

      text-shadow:
        0 0 10px rgba(0, 234, 255, 0.35);
    }

    .login-panel p {
      color: #aab7c4;

      font-size: 15px;

      margin-bottom: 25px;
    }


    /* =========================
       LOGIN BUTTON
    ========================= */

    .login-btn {
      width: 100%;
      height: 52px;

      margin-top: 12px;

      border: none;

      border-radius: 8px;

      font-family: "Niramit", sans-serif;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      transition: 0.2s ease;
    }


    .login-btn span {
      font-family: Arial, sans-serif;

      font-size: 21px;

      font-weight: bold;
    }


    /* Google */

    .login-btn.google {
      background: white;

      color: #222;
    }

    .login-btn.google:hover {
      transform: translateY(-2px);

      box-shadow:
        0 0 18px rgba(255, 255, 255, 0.25);
    }


    /* Facebook */

    .login-btn.facebook {
      background: #1877f2;

      color: white;
    }

    .login-btn.facebook:hover {
      transform: translateY(-2px);

      box-shadow:
        0 0 18px rgba(24, 119, 242, 0.4);
    }


    /* =========================
       STATUS
    ========================= */

    .login-status {
      min-height: 22px;

      margin-top: 15px;

      color: #00eaff;

      font-size: 14px;
    }


    /* =========================
       USER INFO
    ========================= */

    .user-info {
      display: none;

      margin-top: 20px;

      padding-top: 20px;

      border-top: 1px solid rgba(0, 234, 255, 0.2);
    }

    .user-info.show {
      display: block;
    }

    .user-info img {
      width: 60px;
      height: 60px;

      border-radius: 50%;

      border: 2px solid #00eaff;

      margin-bottom: 10px;
    }

    .user-info-name {
      color: white;

      font-size: 17px;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 500px) {

      .menu {
        width: 85%;
      }

      .menu h1 {
        font-size: 38px;
      }

      .login-panel {
        padding: 30px 20px;
      }

    }

  </style>

</head>


<body>


  <!-- =================================
       MAIN MENU
  ================================== -->

  <main class="stage">

    <div class="menu">

      <h1>HANGMAN</h1>

      <!-- เล่นเกม -->
      <a href="categories.html" id="playGameBtn">
        เล่นเกม
      </a>

      <a href="#">
        คู่มือการเล่น
      </a>

      <a href="#">
        ดูอันดับ
      </a>

      <a href="creator.html">
        ประวัติผู้สร้างเกม
      </a>

      <a href="#" id="exitBtn">
        ออกจากเกม
      </a>

    </div>

  </main>



  <!-- =================================
       LOGIN MODAL
  ================================== -->

  <div
    class="login-backdrop"
    id="loginBackdrop"
  >

    <div class="login-panel">


      <!-- ปุ่มปิด -->

      <button
        class="login-close"
        id="loginClose"
        type="button"
      >
        ×
      </button>


      <!-- หัวข้อ -->

      <h2>เข้าสู่ระบบ</h2>

      <p>
        เข้าสู่ระบบเพื่อเริ่มเล่นเกม Hangman
      </p>


      <!-- Google -->

      <button
        class="login-btn google"
        id="googleLogin"
        type="button"
      >

        <span>G</span>

        เข้าสู่ระบบด้วย Google

      </button>


      <!-- Facebook -->

      <button
        class="login-btn facebook"
        id="facebookLogin"
        type="button"
      >

        <span>f</span>

        เข้าสู่ระบบด้วย Facebook

      </button>


      <!-- สถานะ -->

      <div
        class="login-status"
        id="loginStatus"
      ></div>


      <!-- ข้อมูลผู้ใช้ -->

      <div
        class="user-info"
        id="userInfo"
      >

        <img
          id="userPhoto"
          src=""
          alt="User"
        >

        <div
          class="user-info-name"
          id="userName"
        ></div>

      </div>


    </div>

  </div>



  <!-- =================================
       FIREBASE
  ================================== -->

  <script type="module">


    /* ===============================
       IMPORT FIREBASE
    =============================== */

    import {
      initializeApp
    }
    from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      GoogleAuthProvider,
      FacebookAuthProvider,
      signInWithPopup,
      onAuthStateChanged
    }
    from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



    /* ===============================
       FIREBASE CONFIG
       
       ใส่ข้อมูล Firebase ของคุณตรงนี้
    =============================== */

    const firebaseConfig = {

      apiKey: "YOUR_API_KEY",

      authDomain:
        "YOUR_PROJECT_ID.firebaseapp.com",

      projectId:
        "YOUR_PROJECT_ID",

      storageBucket:
        "YOUR_PROJECT_ID.firebasestorage.app",

      messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

      appId:
        "YOUR_APP_ID"

    };



    /* ===============================
       INITIALIZE FIREBASE
    =============================== */

    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);



    /* ===============================
       PROVIDERS
    =============================== */

    const googleProvider =
      new GoogleAuthProvider();


    const facebookProvider =
      new FacebookAuthProvider();



    /* ===============================
       HTML ELEMENTS
    =============================== */

    const playGameBtn =
      document.getElementById("playGameBtn");


    const loginBackdrop =
      document.getElementById("loginBackdrop");


    const loginClose =
      document.getElementById("loginClose");


    const googleLogin =
      document.getElementById("googleLogin");


    const facebookLogin =
      document.getElementById("facebookLogin");


    const loginStatus =
      document.getElementById("loginStatus");


    const userInfo =
      document.getElementById("userInfo");


    const userPhoto =
      document.getElementById("userPhoto");


    const userName =
      document.getElementById("userName");



    /* ===============================
       CURRENT USER
    =============================== */

    let currentUser = null;



    /* ===============================
       CHECK LOGIN
    =============================== */

    onAuthStateChanged(
      auth,
      (user) => {

        currentUser = user;


        if (user) {

          console.log(
            "ผู้ใช้เข้าสู่ระบบแล้ว:",
            user.displayName
          );


          // แสดงข้อมูลผู้ใช้

          userInfo.classList.add("show");


          userName.textContent =
            user.displayName ||
            user.email ||
            "ผู้ใช้งาน";


          if (user.photoURL) {

            userPhoto.src =
              user.photoURL;

          }

        }

        else {

          console.log(
            "ผู้ใช้ยังไม่ได้เข้าสู่ระบบ"
          );


          userInfo.classList.remove(
            "show"
          );

        }

      }
    );



    /* ===============================
       PLAY GAME
    =============================== */

    playGameBtn.addEventListener(
      "click",
      (event) => {

        event.preventDefault();


        /*
          ถ้า Login แล้ว
          เข้า categories.html ได้เลย
        */

        if (currentUser) {

          window.location.href =
            "categories.html";

        }


        /*
          ถ้ายังไม่ได้ Login
          เปิด Login Modal
        */

        else {

          loginBackdrop.classList.add(
            "show"
          );

          loginStatus.textContent = "";

        }

      }
    );



    /* ===============================
       CLOSE LOGIN
    =============================== */

    loginClose.addEventListener(
      "click",
      () => {

        loginBackdrop.classList.remove(
          "show"
        );

      }
    );



    /* ===============================
       CLICK OUTSIDE
    =============================== */

    loginBackdrop.addEventListener(
      "click",
      (event) => {

        if (
          event.target === loginBackdrop
        ) {

          loginBackdrop.classList.remove(
            "show"
          );

        }

      }
    );



    /* ===============================
       GOOGLE LOGIN
    =============================== */

    googleLogin.addEventListener(
      "click",
      async () => {

        try {

          loginStatus.textContent =
            "กำลังเข้าสู่ระบบด้วย Google...";


          googleLogin.disabled = true;

          facebookLogin.disabled = true;


          const result =
            await signInWithPopup(
              auth,
              googleProvider
            );


          const user =
            result.user;


          console.log(
            "Google Login สำเร็จ:",
            user
          );


          loginStatus.textContent =
            "เข้าสู่ระบบสำเร็จ";


          /*
            รอเล็กน้อยแล้วไปหน้า
            เลือกหมวดหมู่
          */

          setTimeout(
            () => {

              window.location.href =
                "categories.html";

            },
            500
          );

        }

        catch (error) {

          console.error(
            "Google Login Error:",
            error
          );


          loginStatus.textContent =
            "ไม่สามารถเข้าสู่ระบบด้วย Google ได้";


          googleLogin.disabled = false;

          facebookLogin.disabled = false;

        }

      }
    );



    /* ===============================
       FACEBOOK LOGIN
    =============================== */

    facebookLogin.addEventListener(
      "click",
      async () => {

        try {

          loginStatus.textContent =
            "กำลังเข้าสู่ระบบด้วย Facebook...";


          googleLogin.disabled = true;

          facebookLogin.disabled = true;


          const result =
            await signInWithPopup(
              auth,
              facebookProvider
            );


          const user =
            result.user;


          console.log(
            "Facebook Login สำเร็จ:",
            user
          );


          loginStatus.textContent =
            "เข้าสู่ระบบสำเร็จ";


          setTimeout(
            () => {

              window.location.href =
                "categories.html";

            },
            500
          );

        }

        catch (error) {

          console.error(
            "Facebook Login Error:",
            error
          );


          loginStatus.textContent =
            "ไม่สามารถเข้าสู่ระบบด้วย Facebook ได้";


          googleLogin.disabled = false;

          facebookLogin.disabled = false;

        }

      }
    );



    /* ===============================
       EXIT GAME
    =============================== */

    const exitBtn =
      document.getElementById("exitBtn");


    if (exitBtn) {

      exitBtn.addEventListener(
        "click",
        (event) => {

          event.preventDefault();


          const confirmExit =
            confirm(
              "คุณต้องการออกจากเกมหรือไม่?"
            );


          if (confirmExit) {

            window.close();

          }

        }
      );

    }


  </script>


</body>

</html>
